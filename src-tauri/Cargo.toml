[package]
name = "damod"
version = "0.1.0"
description = "DaMod — a local-first personal data modeling tool"
authors = ["Vinit"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "damod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PostgreSQL connector (Phase 2). tokio-postgres is pure-Rust (no libpq) for clean
# macOS/Tauri packaging; we only run catalog metadata queries, never table reads.
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# OS secure store for connection credentials (§7). Never persisted in JSON/Git.
keyring = { version = "3", features = ["apple-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
